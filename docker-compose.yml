version: "3.9"

networks:
  oznhmo:
    driver: bridge

services:
  # OpenMRS
  openmrs-db:
    image: mariadb:10.11.7
    container_name: oznhmo-openmrs-db
    command: "mysqld --character-set-server=utf8 --collation-server=utf8_general_ci"
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openmrs}
    volumes:
      - openmrs-db-data:/var/lib/mysql
    networks:
      - oznhmo

  openmrs:
    image: openmrs/openmrs-reference-application-distro:latest
    command: >
      bash -c "
      echo 'install_method=auto' > /usr/local/tomcat/openmrs-server.properties &&
      echo 'connection.url=jdbc:mysql://openmrs-db:3306/openmrs?autoReconnect=true&sessionVariables=default_storage_engine=InnoDB&useUnicode=true&characterEncoding=UTF-8' >> /usr/local/tomcat/openmrs-server.properties &&
      echo 'connection.username=root' >> /usr/local/tomcat/openmrs-server.properties &&
      echo 'connection.password=openmrs_root_password' >> /usr/local/tomcat/openmrs-server.properties &&
      echo 'has_current_openmrs_database=true' >> /usr/local/tomcat/openmrs-server.properties &&
      echo 'create_database_user=false' >> /usr/local/tomcat/openmrs-server.properties &&
      echo 'module_web_admin=true' >> /usr/local/tomcat/openmrs-server.properties &&
      echo 'create_tables=true' >> /usr/local/tomcat/openmrs-server.properties &&
      echo 'auto_update_database=true' >> /usr/local/tomcat/openmrs-server.properties &&
      /usr/local/tomcat/wait-for-it.sh --timeout=3600 openmrs-db:3306 &&
      /usr/local/tomcat/bin/catalina.sh jpda run &
      for i in {1..30}; do sleep 10; curl -L http://localhost:8080/openmrs/ && break; done;
      wait"
    container_name: oznhmo-openmrs
    depends_on:
      - openmrs-db
    ports:
      - "8080:8080"
    environment:
      MODULE_WEB_ADMIN: "true"
      DB_AUTO_UPDATE: "true"
      DB_CREATE_TABLES: "true"
      JAVA_OPTS: "${JAVA_OPTS:- -Xmx2g -Xms512m}"
      OMRS_CONFIG_CONNECTION_SERVER: openmrs-db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: ${OPENMRS_DB_USER:-openmrs}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OPENMRS_DB_PASSWORD:-openmrs}
      DB_HOST: openmrs-db
      DB_DATABASE: openmrs
      DB_USERNAME: root
      DB_PASSWORD: openmrs_root_password
    volumes:
      - openmrs-data:/usr/local/tomcat/.OpenMRS
      - ./openmrs/config/initializer:/openmrs/data/configuration/initializer:ro
      - ./distro/target/distro-emr-configuration/sdk-distro/web/openmrs-distro.properties:/usr/local/tomcat/.OpenMRS/openmrs-distro.properties:ro
    networks:
      - oznhmo

  # Odoo
  odoo-db:
    image: postgres:14
    container_name: oznhmo-odoo-db
    environment:
      POSTGRES_DB: ${ODOO_DATABASE:-odoo}
      POSTGRES_USER: ${ODOO_DB_USER:-odoo}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    networks:
      - oznhmo

  odoo:
    image: mekomsolutions/odoo
    container_name: oznhmo-odoo
    depends_on:
      odoo-db:
        condition: service_started
    environment:
      - HOST=${POSTGRES_DB_HOST:-odoo-db}
      - USER=${ODOO_DB_USER:-odoo}
      - PASSWORD=${ODOO_DB_PASSWORD:-odoo}
      - ADDONS=base,odoo_initializer,insurance_claim
      - ODOO_ADDONS_PATH=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
    ports:
      - "8069:8069"
    volumes:
      - "${ODOO_FILESTORE:-odoo-filestore}:/var/lib/odoo/filestore"
      - "./odoo-modules/insurance_claim:/mnt/extra-addons/insurance_claim:ro"
      - "./odoo.conf:/etc/properties/odoo.conf"
      - "./distro/configs/odoo/initializer_config:/mnt/odoo_config"
      - "${ODOO_CONFIG_CHECKSUMS_PATH:-odoo-checksums}:/mnt/checksums"
    networks:
      - oznhmo

  # SENAITE
  senaite-db:
    image: postgres:14
    container_name: oznhmo-senaite-db
    environment:
      POSTGRES_DB: ${SENAITE_DB_NAME:-senaite}
      POSTGRES_USER: ${SENAITE_DB_USER:-senaite}
      POSTGRES_PASSWORD: ${SENAITE_DB_PASSWORD:-senaite}
    volumes:
      - senaite-db-data:/var/lib/postgresql/data
    networks:
      - oznhmo
      
  senaite:
    image: mekomsolutions/senaite
    container_name: oznhmo-senaite
    depends_on:
      senaite-db:
        condition: service_started
    environment:
      - SITE=${SITE}
      - PASSWORD=${SENAITE_ADMIN_PASSWORD}
      - RELSTORAGE_ADAPTER_OPTIONS=type postgresql,dsn dbname='${SENAITE_DB_NAME:-senaite}' user='${SENAITE_DB_USER:-senaite}' password='${SENAITE_DB_PASSWORD:-senaite}' host='${SENAITE_DB_HOST:-senaite-db}', driver pg8000
      - RELSTORAGE_KEEP_HISTORY=false
      - RELSTORAGE_BLOB_DIR=/home/senaite/senaitelims/blobstorage
      - ADMIN_USER=${SENAITE_ADMIN_USER}
      - ADMIN_PASSWORD=${SENAITE_ADMIN_PASSWORD}
    ports:
      - "8081:8080"
    volumes:
      - ./distro/configs/senaite:/data/importdata/senaite
      - ${SENAITE_BLOBSTORAGE_PATH:-senaite-blobstorage}:/home/senaite/senaitelims/blobstorage
    networks:
      - oznhmo

  # Keycloak
  keycloak-db:
    image: postgres:14
    container_name: oznhmo-keycloak-db
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - oznhmo

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.5
    container_name: oznhmo-keycloak
    restart: unless-stopped
    entrypoint: [ "/bin/bash", "-c" ]
    command: >
      "/opt/keycloak/bin/kc.sh build --health-enabled=true --metrics-enabled=true &&
       /opt/keycloak/bin/kc.sh start --optimized --import-realm"
    volumes:
      - ./distro/configs/keycloak/realms:/opt/keycloak/data/import
      - ${KEYCLOAK_CONFIG_PATH}/themes/carbon:/opt/keycloak/themes/carbon
      - ./ozone-deployment/terraform/certs:/etc/x509/https
    environment:
      KC_HTTPS_CERTIFICATE_FILE: /etc/x509/https/cert.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /etc/x509/https/key.pem
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'false'
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:-admin}
      KC_DIR: /opt/keycloak/data/import
      KC_OVERRIDE: 'false'
      KC_LOG_CONSOLE_OUTPUT: json
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost:8443/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    ports:
      - "8443:8443"
      - "8082:8080"
    depends_on:
      keycloak-db:
        condition: service_started
    networks:
      - oznhmo

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: oznhmo-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./infra/docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - oznhmo

  # IMIS-Connect
  imis-connect:
    build:
      context: .
      dockerfile: ./infra/docker/imis-connect.Dockerfile
    container_name: oznhmo-imis-connect
    restart: unless-stopped
    command: sh -c "sleep 30 && java -jar imis-connect.jar"
    environment:
      OPENIMIS_BASE_URL: ${OPENIMIS_BASE_URL:-http://openimis-be:8000}
      RABBITMQ_URI: ${RABBITMQ_URI:-amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672}
      SERVICE_PORT: ${SERVICE_PORT:-8080}
      OPENIMIS_AUTH: ${OPENIMIS_AUTH:-basic}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8085:8080"
    depends_on:
      - rabbitmq
    networks:
      - oznhmo

  # Apache Superset
  superset-db:
    image: postgres:15
    container_name: oznhmo-superset-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SUPERSET_DB_NAME:-superset}
      POSTGRES_USER: ${SUPERSET_DB_USER:-superset}
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD:-superset}
    volumes:
      - superset-db-data:/var/lib/postgresql/data
    networks:
      - oznhmo

  superset:
    image: apache/superset:latest
    container_name: oznhmo-superset
    restart: unless-stopped
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-this_is_a_secret_key_change_in_production}
      - SUPERSET_DATABASE_URI=postgresql://${SUPERSET_DB_USER:-superset}:${SUPERSET_DB_PASSWORD:-superset}@superset-db:5432/${SUPERSET_DB_NAME:-superset}
      - SUPERSET_LOAD_EXAMPLES=${SUPERSET_LOAD_EXAMPLES:-no}
    ports:
      - "8088:8088"
    depends_on:
      - superset-db
    networks:
      - oznhmo

  frontend:
    image: ghcr.io/openimis/openimis-fe:25.10
    container_name: oznhmo-frontend
    ports:
      - "80:80"
      - "443:443"
    networks:
      - oznhmo

volumes:
  openmrs-db-data:
  openmrs-data:
  odoo-db-data:
  senaite-db-data:
  keycloak-db-data:
  rabbitmq-data:
  superset-db-data:
  odoo-filestore:
  odoo-extra-addons:
  odoo-config:
  odoo-checksums:
  senaite-blobstorage:
